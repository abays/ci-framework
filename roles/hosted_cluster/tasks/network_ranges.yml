# This role only loads the Networking Environment Definition that the
# reproducer generated, so a cifmw_networking_mapper_definition_patch_* variable
# never reaches it. Resolve the isolated networks' ranges again from the raw
# definition plus those patches and merge them in, so each hosted cluster gets
# its own multus, MetalLB and NetConfig ranges. Starting from the raw definition
# every run also puts the default ranges back when no patch is given.
- name: Build the scoped networking definition for the hosted cluster ranges
  vars:
    _net_def_patches: >-
      {{
        hostvars[inventory_hostname] | dict2items |
        selectattr('key', 'match', '^cifmw_networking_mapper_definition_patch.*') |
        sort(attribute='key') | map(attribute='value') | list
      }}
    _patched_definition: >-
      {{
        (
          [{'networks': cifmw_networking_definition.networks}] +
          (_net_def_patches | selectattr('networks', 'defined') | list)
        ) | ansible.builtin.combine(recursive=true)
      }}
  ansible.builtin.set_fact:
    _hosted_cluster_range_definition:
      networks: >-
        {{
          _patched_definition.networks | dict2items |
          selectattr('key', 'in', cifmw_hosted_cluster_networks) | items2dict
        }}

- name: Resolve the hosted cluster network ranges
  cifmw.general.ci_net_map:
    networking_definition: "{{ _hosted_cluster_range_definition }}"
  register: _hosted_cluster_range_net_map

- name: Merge the hosted cluster network ranges into the environment definition
  vars:
    _range_tools: >-
      {%- set _tools = {} -%}
      {%- for _net, _def in _hosted_cluster_range_net_map.networking_env_definition.networks.items() -%}
        {%- set _ = _tools.update({_net: {'tools': _def.get('tools', {})}}) -%}
      {%- endfor -%}
      {{ _tools }}
  ansible.builtin.set_fact:
    cifmw_networking_env_definition: >-
      {{
        cifmw_networking_env_definition |
        combine({'networks': _range_tools}, recursive=true)
      }}
    cacheable: true

- name: Persist the Networking Environment Definition with the hosted cluster ranges
  become: true
  ansible.builtin.copy:
    dest: "{{ cifmw_networking_mapper_networking_env_def_path }}"
    content: "{{ cifmw_networking_env_definition | to_nice_yaml }}"
    mode: "0644"
