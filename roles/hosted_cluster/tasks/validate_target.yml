- name: Read the targeted cluster infrastructure
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cifmw_openshift_kubeconfig }}"
    api_key: "{{ cifmw_openshift_token | default(omit) }}"
    context: "{{ cifmw_openshift_context | default(omit) }}"
    api_version: config.openshift.io/v1
    kind: Infrastructure
    name: cluster
  register: _hosted_cluster_target_infra

- name: Require cifmw_openshift_kubeconfig to target the management cluster
  ansible.builtin.assert:
    that:
      - _hosted_cluster_target_infra.resources | length == 1
      - _hosted_cluster_target_infra.resources[0].status.controlPlaneTopology | default('') != 'External'
    fail_msg: >-
      cifmw_openshift_kubeconfig={{ cifmw_openshift_kubeconfig }} targets a
      hosted cluster, not the management cluster. A previous run's retarget
      is probably still in the Ansible fact cache or in
      artifacts/parameters/zz-hosted-cluster-params.yml; move that file aside
      and use --flush-cache. Do not pass cifmw_openshift_kubeconfig with -e:
      extra vars outrank the role's retarget, so every later phase would
      deploy onto the management cluster.
