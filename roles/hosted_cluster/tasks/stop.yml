# Halts the hosted cluster's worker VMs on the management cluster, which
# frees their CPU and memory while keeping their disks. cifmw_openshift_kubeconfig
# points at the hosted cluster after retarget.yml, so use the management
# kubeconfig it saved.
- name: Require the management cluster kubeconfig
  ansible.builtin.assert:
    that:
      - cifmw_hosted_cluster_management_kubeconfig is defined
    fail_msg: >-
      cifmw_hosted_cluster_management_kubeconfig is not set; it is saved when
      the hosted cluster is deployed by this role.

- name: List the hosted cluster worker VMs
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cifmw_hosted_cluster_management_kubeconfig }}"
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    namespace: "{{ cifmw_hosted_cluster_hosted_namespace }}"
  register: _hosted_cluster_vms

- name: Halt the hosted cluster worker VMs
  kubernetes.core.k8s:
    kubeconfig: "{{ cifmw_hosted_cluster_management_kubeconfig }}"
    state: patched
    definition:
      apiVersion: kubevirt.io/v1
      kind: VirtualMachine
      metadata:
        name: "{{ item.metadata.name }}"
        namespace: "{{ cifmw_hosted_cluster_hosted_namespace }}"
      spec:
        runStrategy: Halted
  loop: "{{ _hosted_cluster_vms.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Wait for the hosted cluster worker VMs to stop
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cifmw_hosted_cluster_management_kubeconfig }}"
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
    namespace: "{{ cifmw_hosted_cluster_hosted_namespace }}"
  register: _hosted_cluster_vmis
  until: _hosted_cluster_vmis.resources | length == 0
  retries: "{{ cifmw_hosted_cluster_wait_retries }}"
  delay: "{{ cifmw_hosted_cluster_wait_delay }}"
